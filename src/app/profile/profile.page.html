<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button class="backbtn" fill="clear">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="title">Perfil</ion-title>

    <ion-buttons slot="end">
      <ion-button class="notification" fill="clear">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content">
  <h1 class="title"></h1>

  <div class="profile-info">

    <ion-item class="profile-item">
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [value]="usuario.nombres"></ion-input>
    </ion-item>

    <ion-item class="profile-item">
      <ion-label position="floating">Apellidos</ion-label>
      <ion-input [value]="usuario.apellidos"></ion-input>
    </ion-item>

    <ion-item class="profile-item">
      <ion-label position="floating">Documento</ion-label>
      <ion-input [value]="usuario.documento"></ion-input>
    </ion-item>

    <ion-item class="profile-item">
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input [value]="usuario.telefono"></ion-input>
    </ion-item>

    <ion-item class="profile-item">
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input [value]="usuario.emailUser"></ion-input>
    </ion-item>

  </div>

  <div class="profile-footer">
    <p>© 2025 Abimar. Todos los derechos reservados.</p>
  </div>
</ion-content>
