<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="mainMenu" autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content">
  <div class="profile-body">

    <!-- Avatar -->
    <div class="profile-avatar-section">
      <div class="profile-avatar">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <h2 class="profile-fullname">{{ usuario.nombres }} {{ usuario.apellidos }}</h2>
      <p class="profile-email">{{ usuario.emailUser }}</p>
    </div>

    <!-- Datos -->
    <div class="profile-fields">

      <div class="profile-field">
        <span class="profile-field__label">
          <ion-icon name="person-outline"></ion-icon>
          Nombres
        </span>
        <ion-item class="ds-form-item profile-item" lines="none">
          <ion-input [value]="usuario.nombres" readonly></ion-input>
        </ion-item>
      </div>

      <div class="profile-field">
        <span class="profile-field__label">
          <ion-icon name="people-outline"></ion-icon>
          Apellidos
        </span>
        <ion-item class="ds-form-item profile-item" lines="none">
          <ion-input [value]="usuario.apellidos" readonly></ion-input>
        </ion-item>
      </div>

      <div class="profile-field">
        <span class="profile-field__label">
          <ion-icon name="card-outline"></ion-icon>
          Documento
        </span>
        <ion-item class="ds-form-item profile-item" lines="none">
          <ion-input [value]="usuario.documento" readonly></ion-input>
        </ion-item>
      </div>

      <div class="profile-field">
        <span class="profile-field__label">
          <ion-icon name="call-outline"></ion-icon>
          Teléfono
        </span>
        <ion-item class="ds-form-item profile-item" lines="none">
          <ion-input [value]="usuario.telefono" readonly></ion-input>
        </ion-item>
      </div>

      <div class="profile-field">
        <span class="profile-field__label">
          <ion-icon name="mail-outline"></ion-icon>
          Correo
        </span>
        <ion-item class="ds-form-item profile-item" lines="none">
          <ion-input [value]="usuario.emailUser" readonly></ion-input>
        </ion-item>
      </div>

    </div>

    <p class="profile-footer">© 2025 Abimar Shop · Todos los derechos reservados</p>
  </div>
</ion-content>
