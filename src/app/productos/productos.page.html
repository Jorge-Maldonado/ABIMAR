<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Gestión de Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #1b1b1b;">
  <div class="ion-padding container"
       style="border: 2px solid #00e5ff; border-radius: 12px; padding: 20px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);">

    <h1 style="color: #fdd835; text-align: center; font-family: 'Montserrat', sans-serif;">
      Productos
    </h1>

    <!-- Formulario Crear Producto -->
    <div class="form-container">
      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Nombre</ion-label>
        <ion-input [(ngModel)]="nombre" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Descripción</ion-label>
        <ion-input [(ngModel)]="descripcion" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Precio</ion-label>
        <ion-input type="number" [(ngModel)]="precio" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Stock</ion-label>
        <ion-input type="number" [(ngModel)]="stock" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Imagen (URL)</ion-label>
        <ion-input [(ngModel)]="imagen" style="color: white;"></ion-input>
      </ion-item>

      <ion-button expand="block" class="main-button" (click)="createProducto()">Crear Producto</ion-button>
    </div>

    <!-- Lista de Productos -->
    <ion-list>
      <ion-item *ngFor="let p of productos" style="color: white;">
        <ion-thumbnail slot="start">
          <img [src]="p.imagen || 'assets/no-image.png'" alt="Producto">
        </ion-thumbnail>
        <ion-label>
          <h2>{{ p.nombre }}</h2>
          <p>{{ p.descripcion }}</p>
          <p>💲 {{ p.precio }} | Stock: {{ p.stock }}</p>
        </ion-label>
        <ion-button slot="end" color="danger" fill="clear" (click)="deleteProducto(p.idproducto)">
          Eliminar
        </ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
