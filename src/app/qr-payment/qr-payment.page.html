<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-qr">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/payment-methods"></ion-back-button>
    </ion-buttons>
    <ion-title>Pago con QR</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="qr-content">

  <div *ngIf="!cargando; else cargandoTpl" class="qr-wrapper">

    <h2 class="qr-title">Escanea el código QR</h2>
    <p class="qr-subtext">Usa tu app bancaria para pagar el monto total</p>

    <div class="qr-card">
      <img src="assets/qr/qr.jpg" alt="QR de pago" class="qr-image" />
    </div>

    <h3 class="qr-total">
      Total: {{ total | number: '1.2-2' }} Bs
    </h3>

    <ion-button expand="block" class="btn-buy qr-btn" (click)="confirmarPago()">
      Confirmar Pago
      <ion-icon slot="end" name="checkmark-outline"></ion-icon>
    </ion-button>

  </div>

  <!-- Loader -->
  <ng-template #cargandoTpl>
    <div class="qr-loading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Generando código QR...</p>
    </div>
  </ng-template>

</ion-content>
