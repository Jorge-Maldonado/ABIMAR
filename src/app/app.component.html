<ion-app>
  <ion-split-pane contentId="main-content" when="false">

    <ion-menu
      menuId="mainMenu"
      contentId="main-content"
      type="overlay"
      side="start"
      [swipeGesture]="swipeEnabled"
      [disabled]="!isMenuEnabled">

      <ion-header class="ion-no-border">
        <ion-toolbar class="menu-toolbar">
          <ion-title>
            <span class="menu-brand">Abimar<span class="menu-brand__dot">.</span></span>
          </ion-title>
          <ion-buttons slot="end">
            <ion-button
              fill="clear"
              class="menu-close-icon"
              aria-label="Cerrar menú"
              (click)="closeMenu($event)">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="menu-content" forceOverscroll="false">
        <div class="side-menu">

          <div class="menu-header">
            <div class="menu-avatar">
              <ion-icon [name]="isGuest ? 'person-outline' : 'person'"></ion-icon>
            </div>
            <div class="menu-user-info">
              <h3>{{ isGuest ? 'Invitado' : 'Mi cuenta' }}</h3>
              <span>{{ userLabel }}</span>
            </div>
          </div>

          <div class="menu-divider"></div>

          <ion-list lines="none" class="menu-list">
            <ion-item
              button
              detail="false"
              (click)="navigate('/home', 1, $event)"
              [class.menu-item--active]="selectedIndex === 1">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>

            <ion-item
              *ngIf="!isGuest"
              button
              detail="false"
              (click)="navigate('/profile', 2, $event)"
              [class.menu-item--active]="selectedIndex === 2">
              <ion-icon slot="start" name="person-outline"></ion-icon>
              <ion-label>Mi Perfil</ion-label>
            </ion-item>

            <ion-item
              *ngIf="!isGuest"
              button
              detail="false"
              (click)="navigate('/my-cart', 3, $event)"
              [class.menu-item--active]="selectedIndex === 3">
              <ion-icon slot="start" name="cart-outline"></ion-icon>
              <ion-label>Mi Carrito</ion-label>
            </ion-item>

            <ion-item
              *ngIf="!isGuest"
              button
              detail="false"
              (click)="navigate('/my-orders', 5, $event)"
              [class.menu-item--active]="selectedIndex === 5">
              <ion-icon slot="start" name="receipt-outline"></ion-icon>
              <ion-label>Mis Pedidos</ion-label>
            </ion-item>

            <ion-item
              button
              detail="false"
              (click)="navigate('/contactus', 7, $event)"
              [class.menu-item--active]="selectedIndex === 7">
              <ion-icon slot="start" name="mail-outline"></ion-icon>
              <ion-label>Contáctanos</ion-label>
            </ion-item>
          </ion-list>

        </div>
      </ion-content>

      <ion-footer class="ion-no-border menu-footer-bar" *ngIf="!isGuest">
        <ion-toolbar>
          <ion-button
            expand="block"
            fill="clear"
            class="menu-logout-btn"
            (click)="logout($event)">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Cerrar sesión
          </ion-button>
        </ion-toolbar>
      </ion-footer>

    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
