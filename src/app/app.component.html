<ion-app>
  <ion-split-pane contentId="main-content">

    <!-- Menú lateral (secundario / admin) -->
    <ion-menu contentId="main-content" type="overlay" [disabled]="!isMenuEnabled">
      <ion-content>
        <div class="side-menu">

          <!-- Header del menú -->
          <div class="menu-header">
            <div class="menu-avatar">
              <ion-icon name="person-outline"></ion-icon>
            </div>
            <div class="menu-user-info">
              <h3>{{ isGuest ? 'Invitado' : 'Mi cuenta' }}</h3>
              <span>Abimar Shop</span>
            </div>
          </div>

          <div class="menu-divider"></div>

          <ion-list>
            <ion-menu-toggle auto-hide="false">
              <ion-item lines="none" (click)="navigate('/home', 1)" detail="false"
                [class.menu-item--active]="selectedIndex == 1">
                <ion-icon slot="start" name="home-outline"></ion-icon>
                <ion-label>Inicio</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle *ngIf="!isGuest" auto-hide="false">
              <ion-item lines="none" (click)="navigate('/profile', 2)" detail="false"
                [class.menu-item--active]="selectedIndex == 2">
                <ion-icon slot="start" name="person-outline"></ion-icon>
                <ion-label>Mi Perfil</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle *ngIf="!isGuest" auto-hide="false">
              <ion-item lines="none" (click)="navigate('/my-cart', 3)" detail="false"
                [class.menu-item--active]="selectedIndex == 3">
                <ion-icon slot="start" name="cart-outline"></ion-icon>
                <ion-label>Mi Carrito</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle *ngIf="!isGuest" auto-hide="false">
              <ion-item lines="none" (click)="navigate('/my-orders', 5)" detail="false"
                [class.menu-item--active]="selectedIndex == 5">
                <ion-icon slot="start" name="receipt-outline"></ion-icon>
                <ion-label>Mis Pedidos</ion-label>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="false">
              <ion-item lines="none" (click)="navigate('/contactus', 7)" detail="false"
                [class.menu-item--active]="selectedIndex == 7">
                <ion-icon slot="start" name="mail-outline"></ion-icon>
                <ion-label>Contáctanos</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>

          <div class="menu-footer">
            <ion-button fill="clear" (click)="close()" class="menu-close-btn">
              <ion-icon slot="start" name="close-outline"></ion-icon>
              Cerrar menú
            </ion-button>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <!-- Contenido principal -->
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
