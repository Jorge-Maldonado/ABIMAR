<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button class="backbtn" routerLink="/welcome" routerDirection="back">
        <img src="assets/back.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #1b1b1b;">
  <div class="container" style="max-width: 400px; margin: auto;">
    <h1 style="color: #fdd835; text-align: center; font-family: 'Montserrat', sans-serif;">Registro</h1>

    <form #signupForm="ngForm" (ngSubmit)="signup()" autocomplete="off">
      <div class="form-container">

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Nombres</ion-label>
          <ion-input name="nombres" [(ngModel)]="nombres" required #nombresInput="ngModel"></ion-input>
        </ion-item>
        <div *ngIf="nombresInput.invalid && nombresInput.touched" class="error-message">
          Ingresa tus nombres.
        </div>

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Apellidos</ion-label>
          <ion-input name="apellidos" [(ngModel)]="apellidos" required #apellidosInput="ngModel"></ion-input>
        </ion-item>
        <div *ngIf="apellidosInput.invalid && apellidosInput.touched" class="error-message">
          Ingresa tus apellidos.
        </div>

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Documento</ion-label>
          <ion-input name="documento" [(ngModel)]="documento" style="color: white;"></ion-input>
        </ion-item>

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Teléfono</ion-label>
          <ion-input name="telefono" type="number" [(ngModel)]="telefono" style="color: white;"></ion-input>
        </ion-item>

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Correo electrónico</ion-label>
          <ion-input name="email" [(ngModel)]="email" type="email" required #emailInput="ngModel"></ion-input>
        </ion-item>
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Ingresa un correo válido.
        </div>

        <ion-item lines="inset">
          <ion-label position="floating" style="color: white;">Contraseña</ion-label>
          <ion-input name="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" required #passwordInput="ngModel"></ion-input>
          <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="end" (click)="togglePassword()"></ion-icon>
        </ion-item>
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
          La contraseña es obligatoria.
        </div>

        <ion-button type="submit" expand="block" class="main-button" [disabled]="signupForm.invalid" style="margin-top: 20px;">
          Registrarse
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
