<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button class="backbtn" routerLink="/welcome" routerDirection="back">
        <img src="assets/back.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #1b1b1b;">
  <div class="ion-padding container" 
       style="border: 2px solid #00e5ff; border-radius: 12px; padding: 20px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);">

    <h1 style="color: #fdd835; font-family: 'Montserrat', sans-serif; text-align: center; margin-bottom: 24px; text-shadow: 1px 1px 4px rgba(0,0,0,0.4);">
      Signup
    </h1>

    <div class="form-container">
      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Name</ion-label>
        <ion-input [(ngModel)]="fullName" name="fullName" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Email</ion-label>
        <ion-input [(ngModel)]="email" name="email" type="email" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Password</ion-label>
        <ion-input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" style="color: white;"></ion-input>
        <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="end" color="medium" (click)="togglePassword()"></ion-icon>
      </ion-item>

      <ion-button expand="block" class="main-button" (click)="signup()">Sign Up</ion-button>

      <div class="sign-up" style="text-align: center; margin-top: 16px; color: #ccc;">
        Already have an account?
        <ion-button fill="clear" class="secondary-button" size="small" routerLink="/login" routerDirection="forward">
          Sign in
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
