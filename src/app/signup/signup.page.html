<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button class="backbtn" routerLink="/welcome" routerDirection="back">
        <img src="assets/back.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">

    <h1>Registro</h1>

    <form class="form-container" #signupForm="ngForm" (ngSubmit)="signup()" autocomplete="off">

      <ion-item lines="inset">
        <ion-label position="floating">Nombre completo</ion-label>
        <ion-input
          name="fullName"
          [(ngModel)]="fullName"
          required
          autocomplete="off"
          #fullNameInput="ngModel">
        </ion-input>
      </ion-item>
      <div *ngIf="fullNameInput.invalid && fullNameInput.touched" class="error-message">
        Por favor ingresa tu nombre completo.
      </div>

      <ion-item lines="inset">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input
          name="email"
          [(ngModel)]="email"
          type="email"
          required
          email
          autocomplete="off"
          #emailInput="ngModel">
        </ion-input>
      </ion-item>
      <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
        Ingresa un correo electrónico válido.
      </div>

      <ion-item lines="inset">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input
          name="password"
          [(ngModel)]="password"
          [type]="showPassword ? 'text' : 'password'"
          required
          autocomplete="off"
          #passwordInput="ngModel">
        </ion-input>
        <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="end" (click)="togglePassword()"></ion-icon>
      </ion-item>
      <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
        La contraseña es obligatoria.
      </div>

      <ion-button type="submit" expand="block" class="main-button" [disabled]="signupForm.invalid">
        Registrarse
      </ion-button>

      <div class="sign-up">
        ¿Ya tienes una cuenta?
        <ion-button fill="clear" class="secondary-button" size="small" routerLink="/login" routerDirection="forward">
          Iniciar sesión
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
