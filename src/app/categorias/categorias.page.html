<ion-content class="custom-categorias">

  <div class="container">

    <!-- Header -->
    <div class="page-header">
      <h1 class="page-title">Categorías</h1>
      <p class="page-subtitle">Gestión de categorías disponibles</p>
    </div>

    <!-- Formulario -->
    <div class="form-container">
      <ion-item lines="none" class="ds-form-item">
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="nombre"></ion-input>
      </ion-item>

      <ion-item lines="none" class="ds-form-item">
        <ion-label position="floating">Descripción</ion-label>
        <ion-input [(ngModel)]="descripcion"></ion-input>
      </ion-item>

      <ion-button expand="block" class="btn-primary" *ngIf="!editId" (click)="createCategoria()">
        Crear Categoría
      </ion-button>

      <ion-button expand="block" class="btn-warning" *ngIf="editId" (click)="updateCategoria()">
        Guardar Cambios
      </ion-button>

      <ion-button expand="block" class="btn-ghost" *ngIf="editId" (click)="resetForm()">
        Cancelar
      </ion-button>
    </div>

    <!-- Divider -->
    <div class="ds-divider"></div>

    <h3 class="list-title">Lista de Categorías</h3>

    <!-- Buscador -->
    <div class="ds-searchbar">
      <ion-searchbar [(ngModel)]="searchTerm" placeholder="Buscar categoría..."></ion-searchbar>
    </div>

    <!-- Lista -->
    <ion-list *ngIf="categoriasFiltradas().length > 0; else noCategorias">

      <ion-item *ngFor="let c of categoriasFiltradas()" class="categoria-item">

        <ion-label>
          <h2>{{ c.nombre }}</h2>
          <p>{{ c.descripcion }}</p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-button fill="clear" class="btn-action-warning" (click)="editCategoria(c)">
            Editar
          </ion-button>

          <ion-button fill="clear" class="btn-action-danger" (click)="deleteCategoria(c.idcategoria)">
            Eliminar
          </ion-button>
        </ion-buttons>

      </ion-item>

    </ion-list>

    <ng-template #noCategorias>
      <div class="ds-empty">
        <ion-icon name="albums-outline"></ion-icon>
        <h3>No hay categorías</h3>
        <p>Crea tu primera categoría para comenzar</p>
      </div>
    </ng-template>

  </div>

</ion-content>
