<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Slider de imágenes -->
  <ion-slides pager="true" class="product-slider">
    <ion-slide>
      <img [src]="producto?.imagen || 'assets/no-image.png'" />
    </ion-slide>
  </ion-slides>

  <div class="ion-padding-vertical">
    <h1 class="item-name">{{ producto?.nombre }}</h1>

    <h4 class="price">
      Bs.{{ producto?.precio }}
      <span *ngIf="producto?.precioAnterior" class="real-price">
        Bs.{{ producto?.precioAnterior }}
      </span>
    </h4>
  </div>

  <div class="seperator"><hr></div>

  <div class="description">
    <h5>Descripción</h5>
    <p>{{ producto?.descripcion || 'Sin descripción disponible.' }}</p>
  </div>

  <div class="seperator"><hr></div>

  <div class="variation">
    <ion-segment (ionChange)="segmentChanged($event)" value="size">
      <ion-segment-button value="size">
        <ion-label>Seleccionar talla</ion-label>
      </ion-segment-button>
      <ion-segment-button value="color">
        <ion-label>Seleccionar color</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <div class="variation-selector">
    <div class="sizes" [class.active-variation]="activeVariation == 'size'">
      <div [class.active]="selectedSize == 1" (click)="changeSize(1)">S</div>
      <div [class.active]="selectedSize == 2" (click)="changeSize(2)">M</div>
      <div [class.active]="selectedSize == 3" (click)="changeSize(3)">L</div>
      <div [class.active]="selectedSize == 4" (click)="changeSize(4)">XL</div>
    </div>

    <div class="colors" [class.active-variation]="activeVariation == 'color'">
      <div [class.active]="selectedColor == 1" (click)="changeColor(1)">NEGRO</div>
      <div [class.active]="selectedColor == 2" (click)="changeColor(2)">VERDE</div>
      <div [class.active]="selectedColor == 3" (click)="changeColor(3)">AZUL</div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-row>
    <ion-col size="6">
      <ion-button expand="full" color="light">Agregar al carrito</ion-button>
    </ion-col>
    <ion-col size="6">
      <ion-button expand="full">Comprar ahora</ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
