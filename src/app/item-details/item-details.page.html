<ion-header class="ion-no-border">
  <ion-toolbar class="item-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="agregarFavorito(producto)">
        <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="item-content">

  <!-- Imagen hero -->
  <div class="item-hero">
    <ion-slides pager="true" class="item-slider">
      <ion-slide>
        <img [src]="producto?.imagen || 'assets/no-image.png'" [alt]="producto?.nombre" class="item-hero__img" />
      </ion-slide>
    </ion-slides>
  </div>

  <!-- Info principal -->
  <div class="item-body">
    <div class="item-header">
      <h1 class="item-name">{{ producto?.nombre }}</h1>
      <div class="item-price-row">
        <span class="item-price">Bs. {{ producto?.precio }}</span>
        <span *ngIf="producto?.precioAnterior" class="item-price-old">Bs. {{ producto?.precioAnterior }}</span>
      </div>
    </div>

    <div class="item-divider"></div>

    <!-- Descripción -->
    <div class="item-section">
      <h3 class="item-section__title">Descripción</h3>
      <p class="item-section__text">{{ producto?.descripcion || 'Sin descripción disponible.' }}</p>
    </div>

    <div class="item-divider"></div>

    <!-- Variaciones -->

  </div>

</ion-content>

<!-- Footer sticky con CTAs -->
<ion-footer class="ion-no-border item-footer">
  <div class="item-footer__inner">
    <ion-button expand="block" class="btn-ghost footer-btn-cart" (click)="agregarAlCarrito()">
      <ion-icon slot="start" name="cart-outline"></ion-icon>
      Al carrito
    </ion-button>
    <ion-button expand="block" class="btn-buy footer-btn-buy">
      Comprar ahora
    </ion-button>
  </div>
</ion-footer>
