<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Mis pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="orders-content">
  <div class="orders-body">

    <!-- Pedidos (datos de ejemplo mientras no hay backend) -->
    <div class="order-card" *ngFor="let order of pedidos">
      <div class="order-card__header">
        <div class="order-card__img-wrap">
          <img [src]="order.imagen" [alt]="order.nombre" />
        </div>
        <div class="order-card__info">
          <p class="order-card__name">{{ order.nombre }}</p>
          <p class="order-card__brand">{{ order.marca }}</p>
          <p class="order-card__price">Bs. {{ order.precio | number:'1.2-2' }}</p>
        </div>
        <span class="order-card__badge">Entregado</span>
      </div>
      <div class="order-card__footer">
        <ion-button expand="block" class="btn-ghost order-repeat-btn">
          <ion-icon slot="start" name="refresh-outline"></ion-icon>
          Pedir de nuevo
        </ion-button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="ds-empty" *ngIf="pedidos.length === 0">
      <ion-icon name="receipt-outline"></ion-icon>
      <h3>Sin pedidos aún</h3>
      <p>Tus compras aparecerán aquí</p>
    </div>

  </div>
</ion-content>
