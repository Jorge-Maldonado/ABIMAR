<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Mis pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="orders-content">
  <div class="orders-body">

    <!-- Pedidos (datos de ejemplo mientras no hay backend) -->
    <div class="order-card" *ngFor="let order of pedidos" (click)="abrirPedido(order)">

      <div class="order-card__header">

        <div class="order-card__info">
          <p class="order-card__name">
            Pedido #{{ order.idpedido }}
          </p>

          <p class="order-card__brand">
            {{ order.direccionEnvio }}
          </p>

          <p class="order-card__price">
            Bs. {{ order.monto | number:'1.2-2' }}
          </p>

          <p class="order-card__date">
            {{ order.fecha | date:'short' }}
          </p>
        </div>

        <span class="order-card__badge" [ngClass]="getEstadoClase(order.status)">
          {{ order.status }}
        </span>

      </div>

    </div>

    <!-- Empty state -->
    <div class="ds-empty" *ngIf="pedidos.length === 0">
      <ion-icon name="receipt-outline"></ion-icon>
      <h3>Sin pedidos aún</h3>
      <p>Tus compras aparecerán aquí</p>
    </div>

  </div>
</ion-content>
