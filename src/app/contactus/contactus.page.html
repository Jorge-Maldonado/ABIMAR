<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-menu-button class="backbtn"></ion-menu-button>
    </ion-buttons>

    <ion-title class="title">Contáctenos</ion-title>

    <ion-buttons slot="end">
      <ion-button class="notification" fill="clear">
        <ion-icon slot="icon-only" name="mail-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="contact-content">
  <!-- ENVOLTORIO FLEX -->
  <div class="contact-wrapper">

    <div class="contact-container">

      <h2 class="contact-title">Envíanos un mensaje</h2>

      <form (ngSubmit)="sendMessage()" #contactForm="ngForm">

        <ion-item class="contact-item">
          <ion-label position="floating">Nombre</ion-label>
          <ion-input type="text" name="name" [(ngModel)]="contact.name" required></ion-input>
        </ion-item>

        <ion-item class="contact-item">
          <ion-label position="floating">Correo</ion-label>
          <ion-input type="email" name="email" [(ngModel)]="contact.email" required></ion-input>
        </ion-item>

        <ion-item class="contact-item">
          <ion-label position="floating">Mensaje</ion-label>
          <ion-textarea name="message" [(ngModel)]="contact.message" required></ion-textarea>
        </ion-item>

        <ion-button expand="block" type="submit" class="send-btn" [disabled]="!contactForm.form.valid">
          Enviar
        </ion-button>

      </form>

      <div *ngIf="success" class="success-message">
        ¡Gracias! Tu mensaje ha sido enviado.
      </div>

    </div>

  </div>
</ion-content>
