<ion-split-pane contentId="admin-main-content" when="false">

  <ion-menu
    menuId="adminMenu"
    contentId="admin-main-content"
    type="overlay"
    side="start">

    <ion-header class="ion-no-border">
      <ion-toolbar class="admin-menu-toolbar">
        <ion-title class="toolbar-brand">
          Admin<span class="toolbar-brand__dot">.</span>
        </ion-title>
        <ion-buttons slot="end">
          <ion-button
            fill="clear"
            class="menu-close-icon"
            aria-label="Cerrar menú"
            (click)="closeMenu($event)">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="admin-menu-content" forceOverscroll="false">
      <div class="side-menu">

        <div class="menu-header">
          <div class="menu-avatar">
            <ion-icon name="person"></ion-icon>
          </div>
          <div class="menu-user-info">
            <h3>Admin</h3>
            <span>Panel de control</span>
          </div>
        </div>

        <div class="menu-divider"></div>

        <ion-list lines="none" class="menu-list">
          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'dashboard'"
            (click)="go('dashboard', $event)">
            <ion-icon name="speedometer-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'roles'"
            (click)="go('roles', $event)">
            <ion-icon name="people-circle" slot="start"></ion-icon>
            <ion-label>Roles</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'usuarios'"
            (click)="go('usuarios', $event)">
            <ion-icon name="person-circle" slot="start"></ion-icon>
            <ion-label>Usuarios</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'categorias'"
            (click)="go('categorias', $event)">
            <ion-icon name="albums" slot="start"></ion-icon>
            <ion-label>Categorías</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'productos'"
            (click)="go('productos', $event)">
            <ion-icon name="cube" slot="start"></ion-icon>
            <ion-label>Productos</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'pedidos'"
            (click)="go('pedidos', $event)">
            <ion-icon name="receipt-outline" slot="start"></ion-icon>
            <ion-label>Pedidos</ion-label>
          </ion-item>

          <ion-item
            button
            detail="false"
            class="menu-item"
            [class.menu-item--active]="selected === 'contactos'"
            (click)="go('contactos', $event)">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-label>Mensajes</ion-label>
          </ion-item>
        </ion-list>

        <div class="menu-footer">
          <ion-button expand="block" fill="clear" class="menu-logout-btn" (click)="logout()">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            Cerrar sesión
          </ion-button>
        </div>

      </div>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="admin-main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button menu="adminMenu" autoHide="false"></ion-menu-button>
        </ion-buttons>

        <ion-title>Panel de Administración</ion-title>

        <ion-buttons slot="end">
          <ion-button class="logout-btn" (click)="logout()" aria-label="Cerrar sesión">
            <ion-icon name="log-out-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="admin-content">
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>

</ion-split-pane>
