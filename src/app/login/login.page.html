<ion-content class="login-content" [fullscreen]="true" forceOverscroll="false">

  <div class="app-hero-bg" aria-hidden="true">
    <div class="app-hero-bg__glow app-hero-bg__glow--1"></div>
    <div class="app-hero-bg__glow app-hero-bg__glow--2"></div>
    <div class="app-hero-bg__grid"></div>
  </div>

  <a
    class="app-back-fab"
    routerLink="/welcome"
    routerDirection="back"
    aria-label="Volver">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </a>

  <div class="auth-container">

    <div class="auth-brand">
      <img
        src="assets/logoAbimarFondoOscuro.svg"
        alt="Abimar Shop"
        class="brand-mark"
        width="72"
        height="72" />
      <h1 class="brand-name">Abimar Shop</h1>
      <p class="brand-headline">Tecnología al mejor precio</p>
      <p class="brand-tagline">Inicia sesión para comprar y seguir tus pedidos</p>
    </div>

    <form class="auth-form" (ngSubmit)="login()" autocomplete="on">

      <ion-item class="ds-form-item" [class.is-invalid]="emailInvalid" lines="none">
        <ion-icon name="mail-outline" slot="start" class="field-icon"></ion-icon>
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input
          [(ngModel)]="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          enterkeyhint="next"
          required>
        </ion-input>
      </ion-item>
      <p *ngIf="emailInvalid" class="field-hint">Ingresa un correo válido.</p>

      <ion-item class="ds-form-item" [class.is-invalid]="passwordInvalid" lines="none">
        <ion-icon name="lock-closed-outline" slot="start" class="field-icon"></ion-icon>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          [(ngModel)]="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          enterkeyhint="go"
          required>
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="toggle-btn"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
      <p *ngIf="passwordInvalid" class="field-hint">La contraseña es obligatoria.</p>

      <div *ngIf="errorMessage" class="auth-error" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <ion-button
        expand="block"
        class="btn-primary auth-submit"
        type="submit"
        [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Ingresar</span>
      </ion-button>
    </form>

    <div class="auth-divider">
      <span>o</span>
    </div>

    <ion-button
      expand="block"
      fill="outline"
      class="auth-guest"
      type="button"
      [disabled]="loading"
      (click)="continueAsGuest()">
      Continuar como invitado
    </ion-button>

    <div class="auth-footer">
      <span>¿No tienes cuenta?</span>
      <ion-button fill="clear" class="auth-link" routerLink="/signup" routerDirection="forward">
        Regístrate
      </ion-button>
    </div>

  </div>
</ion-content>
