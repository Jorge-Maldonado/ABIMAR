<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/welcome" routerDirection="back" fill="clear">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">

  <!-- 🔥 FONDO REAL -->
  <div class="bg-overlay"></div>

  <!-- CONTENIDO -->
  <div class="auth-container">

    <div class="auth-header">
      <h1>Iniciar sesión</h1>
      <p>Accede a tu cuenta Abimar</p>
    </div>

    <div class="auth-form">

      <ion-item class="ds-form-item" lines="none">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input [(ngModel)]="email" name="email" type="email" inputmode="email" autocomplete="email">
        </ion-input>
        <ion-icon name="mail-outline" slot="end" class="field-icon"></ion-icon>
      </ion-item>

      <ion-item class="ds-form-item" lines="none">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password">
        </ion-input>
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="end"
          class="field-icon field-icon--toggle" (click)="togglePassword()">
        </ion-icon>
      </ion-item>

      <div *ngIf="errorMessage" class="auth-error">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMessage }}
      </div>

      <!-- 🔥 FIX LOGIN -->
      <ion-button expand="block" class="auth-submit" type="button" [disabled]="loading" (click)="login()">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Ingresar</span>
      </ion-button>

    </div>

    <div class="auth-footer">
      <span>¿No tienes cuenta?</span>
      <ion-button fill="clear" class="auth-link" routerLink="/signup" routerDirection="forward">
        Regístrate
      </ion-button>
    </div>

  </div>
</ion-content>
