<ion-header class="ion-no-border">
  <ion-toolbar class="login-toolbar">
    <ion-buttons slot="start">
      <ion-button routerLink="/welcome" routerDirection="back" fill="clear" aria-label="Volver">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="auth-container">

    <div class="auth-brand">
      <img src="/assets/logoAbimarFondoOscuro.svg" alt="Abimar Shop" class="brand-mark" />
      <h1 class="brand-name">Abimar Shop</h1>
      <p class="brand-tagline">Inicia sesión para comprar y seguir tus pedidos</p>
    </div>

    <form class="auth-form" (ngSubmit)="login()" autocomplete="on">

      <ion-item class="ds-form-item" [class.is-invalid]="emailInvalid" lines="none">
        <ion-icon name="mail-outline" slot="start" class="field-icon"></ion-icon>
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input
          [(ngModel)]="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          enterkeyhint="next"
          required>
        </ion-input>
      </ion-item>
      <p *ngIf="emailInvalid" class="field-hint">Ingresa un correo válido.</p>

      <ion-item class="ds-form-item" [class.is-invalid]="passwordInvalid" lines="none">
        <ion-icon name="lock-closed-outline" slot="start" class="field-icon"></ion-icon>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          [(ngModel)]="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          enterkeyhint="go"
          required>
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="toggle-btn"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
      <p *ngIf="passwordInvalid" class="field-hint">La contraseña es obligatoria.</p>

      <div *ngIf="errorMessage" class="auth-error" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <ion-button
        expand="block"
        class="auth-submit"
        type="submit"
        [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Ingresar</span>
      </ion-button>
    </form>

    <div class="auth-divider">
      <span>o</span>
    </div>

    <ion-button
      expand="block"
      fill="outline"
      class="auth-guest"
      type="button"
      [disabled]="loading"
      (click)="continueAsGuest()">
      Continuar como invitado
    </ion-button>

    <div class="auth-footer">
      <span>¿No tienes cuenta?</span>
      <ion-button fill="clear" class="auth-link" routerLink="/signup" routerDirection="forward">
        Regístrate
      </ion-button>
    </div>

  </div>
</ion-content>
