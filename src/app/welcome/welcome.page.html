<ion-content class="welcome-content" [fullscreen]="true">

  <!-- Fondo con gradiente -->
  <div class="welcome-bg">
    <div class="welcome-bg__glow welcome-bg__glow--1"></div>
    <div class="welcome-bg__glow welcome-bg__glow--2"></div>
  </div>

  <!-- Imagen hero -->
  <div class="welcome-hero">
    <img src="assets/welcome.png" alt="Abimar Shop" class="welcome-hero__img" />
  </div>

  <!-- Contenido -->
  <div class="welcome-body">
    <div class="welcome-brand">
      <span class="welcome-brand__tag">Bienvenido a</span>
      <h1 class="welcome-brand__name">Abimar</h1>
      <p class="welcome-brand__subtitle">Tu tienda favorita, ahora en tu bolsillo</p>
    </div>

    <div class="welcome-actions">
      <ion-button expand="block" class="btn-primary" routerLink="/login" routerDirection="forward">
        Iniciar sesión
      </ion-button>

      <ion-button expand="block" class="btn-ghost" routerLink="/signup" routerDirection="forward">
        Crear cuenta
      </ion-button>

      <button class="welcome-guest-btn" (click)="goHomeWithoutLogin()">
        Continuar como invitado
      </button>
    </div>
  </div>

</ion-content>
