<ion-content class="ion-padding" style="--background: #1b1b1b;">
  <div class="ion-padding container"
       style="border: 2px solid #00e5ff; border-radius: 12px; padding: 20px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);">

    <h1 style="color: #fdd835; text-align: center; font-family: 'Montserrat', sans-serif;">Roles</h1>
    <h2 style="color: #aaa; text-align: center; font-size: 16px; font-weight: normal; margin-bottom: 20px;">
      Gestión de roles del sistema
    </h2>

    <div class="form-container">
      <ion-item lines="none">
        <ion-label position="floating" style="color: white;">Descripción</ion-label>
        <ion-input [(ngModel)]="descripcion" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="floating" style="color: white;">Estado</ion-label>
        <ion-input type="number" [(ngModel)]="estado" style="color: white;"></ion-input>
      </ion-item>

      <ion-button expand="block" class="main-button" *ngIf="!editId" (click)="createRole()">Crear Rol</ion-button>
      <ion-button expand="block" color="warning" *ngIf="editId" (click)="updateRole()">Guardar Cambios</ion-button>
      <ion-button expand="block" color="medium" fill="clear" *ngIf="editId" (click)="resetForm()">Cancelar</ion-button>
    </div>

    <ion-item-divider style="margin: 20px 0; border-top: 1px solid #444; --background: transparent;">
      <ion-label style="color: #fdd835; font-weight: bold;">Lista de Roles</ion-label>
    </ion-item-divider>

    <ion-searchbar [(ngModel)]="searchTerm" placeholder="Buscar rol..." style="--color: white; --placeholder-color: #aaa;"></ion-searchbar>

    <ion-list *ngIf="rolesFiltrados().length > 0; else noRoles">
      <ion-item *ngFor="let rol of rolesFiltrados()" lines="none" style="color: white;">
        <ion-label>
          <h2>{{ rol.descripcion }}</h2>
          <p>Estado: {{ rol.estado }}</p>
        </ion-label>
        <ion-buttons slot="end">
          <ion-button color="warning" fill="clear" (click)="editRole(rol)">Editar</ion-button>
          <ion-button color="danger" fill="clear" (click)="deleteRole(rol.idrol)">Eliminar</ion-button>
        </ion-buttons>
      </ion-item>
    </ion-list>

    <ng-template #noRoles>
      <p style="color: #ccc; text-align: center; margin-top: 20px;">No hay roles disponibles</p>
    </ng-template>
  </div>
</ion-content>
