<ion-content class="ion-padding" style="--background: #1b1b1b;">
  <div
    class="ion-padding container"
    style="border: 2px solid #00e5ff; border-radius: 12px; padding: 20px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);"
  >
    <h1
      style="color: #fdd835; text-align: center; font-family: 'Montserrat', sans-serif;"
    >
      Roles
    </h1>

    <!-- Formulario Crear Rol -->
    <div class="form-container">
      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Descripción</ion-label>
        <ion-input [(ngModel)]="descripcion" style="color: white;"></ion-input>
      </ion-item>

      <ion-item lines="inset">
        <ion-label position="floating" style="color: white;">Estado</ion-label>
        <ion-input type="number" [(ngModel)]="estado" style="color: white;"></ion-input>
      </ion-item>

      <ion-button expand="block" class="main-button" (click)="createRole()">Crear Rol</ion-button>
    </div>

    <!-- Lista de Roles -->
    <ion-list>
      <ion-item *ngFor="let rol of roles">
        <ion-label>
          <h2>{{ rol.descripcion }}</h2>
          <p>Estado: {{ rol.estado }}</p>
        </ion-label>
        <ion-button slot="end" color="danger" fill="clear" (click)="deleteRole(rol.idrol)">
          Eliminar
        </ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
