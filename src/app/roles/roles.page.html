<ion-content class="roles-page">

  <div class="roles-container">

    <!-- Header -->
    <div class="roles-header">
      <h1 class="roles-title">Roles</h1>
      <p class="roles-subtitle">Gestión de roles del sistema</p>
    </div>

    <!-- Formulario -->
    <div class="roles-form">

      <ion-item class="ds-form-item" lines="none">
        <ion-label position="floating">Descripción</ion-label>
        <ion-input [(ngModel)]="descripcion"></ion-input>
      </ion-item>

      <ion-item class="ds-form-item" lines="none">
        <ion-label position="floating">Estado</ion-label>
        <ion-input type="number" [(ngModel)]="estado"></ion-input>
      </ion-item>

      <ion-button expand="block" class="btn-primary" *ngIf="!editId" (click)="createRole()">
        Crear Rol
      </ion-button>

      <ion-button expand="block" class="btn-buy" *ngIf="editId" (click)="updateRole()">
        Guardar Cambios
      </ion-button>

      <ion-button expand="block" fill="clear" class="btn-ghost" *ngIf="editId" (click)="resetForm()">
        Cancelar
      </ion-button>

    </div>

    <!-- Divider -->
    <div class="roles-divider"></div>

    <!-- Buscador -->
    <div class="roles-search ds-searchbar">
      <ion-searchbar [(ngModel)]="searchTerm" placeholder="Buscar rol..."></ion-searchbar>
    </div>

    <!-- Lista -->
    <ion-list *ngIf="rolesFiltrados().length > 0; else noRoles" class="roles-list">

      <ion-item *ngFor="let rol of rolesFiltrados()" class="role-item" lines="none">

        <ion-label>
          <h2>{{ rol.descripcion }}</h2>
          <p>Estado: {{ rol.estado }}</p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-button fill="clear" class="btn-warning" (click)="editRole(rol)">
            Editar
          </ion-button>

          <ion-button fill="clear" class="btn-danger" (click)="deleteRole(rol.idrol)">
            Eliminar
          </ion-button>
        </ion-buttons>

      </ion-item>

    </ion-list>

    <!-- Empty -->
    <ng-template #noRoles>
      <div class="ds-empty">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <h3>No hay roles</h3>
        <p>No existen roles registrados</p>
      </div>
    </ng-template>

  </div>

</ion-content>
