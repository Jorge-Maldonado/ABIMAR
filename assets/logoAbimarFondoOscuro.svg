<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Icono tipo etiqueta -->
  <g transform="translate(20,30)">
    <!-- Fondo etiqueta -->
    <path d="M20 40 L80 0 H160 Q180 0 180 20 V120 Q180 140 160 140 H20 Q0 140 0 120 V60 Q0 50 10 45 Z"
          fill="#00E5FF"/>
    
    <!-- Parlante -->
    <circle cx="90" cy="80" r="45" fill="#111827"/>
    <circle cx="90" cy="80" r="35" fill="none" stroke="#ffffff" stroke-width="4"/>

    <!-- Rayo -->
    <polygon points="85,50 70,90 90,90 80,120 115,75 95,75 110,50"
             fill="#ffffff"/>
    
    <!-- Punto etiqueta -->
    <circle cx="150" cy="20" r="6" fill="#ffffff"/>
  </g>

  <!-- Texto -->
  <text x="220" y="95" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
    Abimar
  </text>

  <text x="400" y="95" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#00E5FF">
    Shop
  </text>

  <!-- Línea -->
  <line x1="220" y1="110" x2="550" y2="110" stroke="#4B5563" stroke-width="2"/>

  <!-- Slogan -->
  <text x="220" y="140" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9CA3AF">
    Tecnología al mejor precio
  </text>

</svg>